[workspace]
resolver = "2"
members = ["gov", "vault", "fee-router", "reward-reserve", "blend-adapter", "insurance-fund", "peg-monitor", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Quasaria contributors"]
publish = false

[workspace.dependencies]
soroban-sdk = "28.0.0"
quasaria-gov = { path = "gov" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
